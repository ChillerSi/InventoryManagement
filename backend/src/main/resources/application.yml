spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
server:
  error:
    include-message: always
app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: inventory-images
  qdrant-url: ${QDRANT_URL:http://localhost:6333}
  embedding-url: ${EMBEDDING_URL:http://localhost:8000}
  search-threshold: ${IMAGE_SEARCH_THRESHOLD:0.55}
