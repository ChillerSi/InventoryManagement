spring:
  application:
    name: inventory-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
server:
  error:
    include-message: always
logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    root: ${LOG_LEVEL:INFO}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:10GB}
app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: inventory-images
  qdrant-url: ${QDRANT_URL:http://localhost:6333}
  embedding-url: ${EMBEDDING_URL:http://localhost:8000}
  search-threshold: ${IMAGE_SEARCH_THRESHOLD:0.55}
