services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventory}
      MYSQL_USER: ${MYSQL_USER:-inventory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inventory123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
    ports: ["3306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-10-15T17-29-55Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.2}
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]
  embedding-service:
    build: ./embedding-service
    environment:
      SIGLIP_MODEL: ${SIGLIP_MODEL:-google/siglip2-base-patch16-224}
      SIGLIP_MODEL_REVISION: ${SIGLIP_MODEL_REVISION:-75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2}
      HF_HOME: /models/huggingface
    ports: ["8000:8000"]
    volumes: [siglip-models:/models/huggingface]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-inventory}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-inventory}
      DB_PASSWORD: ${MYSQL_PASSWORD:-inventory123}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding-service:8000
      SIGLIP_MODEL_VERSION: ${SIGLIP_MODEL:-google/siglip2-base-patch16-224}@${SIGLIP_MODEL_REVISION:-75de2d55ec2d0b4efc50b3e9ad70dba96a7b2fa2}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-products_siglip2_base_patch16_224_75de2d55}
      IMAGE_SEARCH_THRESHOLD: ${IMAGE_SEARCH_THRESHOLD:-0.55}
      LOG_PATH: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      WEB_LOG_LEVEL: ${WEB_LOG_LEVEL:-INFO}
      SQL_LOG_LEVEL: ${SQL_LOG_LEVEL:-WARN}
      SQL_BIND_LOG_LEVEL: ${SQL_BIND_LOG_LEVEL:-WARN}
      LOG_MAX_FILE_SIZE: ${LOG_MAX_FILE_SIZE:-100MB}
      LOG_MAX_HISTORY: ${LOG_MAX_HISTORY:-30}
      LOG_TOTAL_SIZE_CAP: ${LOG_TOTAL_SIZE_CAP:-10GB}
    ports: ["8080:8080"]
    volumes: [./logs:/app/logs]
    depends_on:
      mysql: {condition: service_healthy}
      minio: {condition: service_started}
      qdrant: {condition: service_started}
      embedding-service: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql-data:
  minio-data:
  qdrant-data:
  siglip-models:
